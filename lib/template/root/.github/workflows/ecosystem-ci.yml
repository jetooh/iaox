name: Ecosystem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected precisa do histórico do git

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ecossistema todo)
        run: npm run lint

      - name: Knip (código morto)
        run: npm run knip

      - name: Test & build (só o que mudou)
        run: npx turbo run test build --affected
